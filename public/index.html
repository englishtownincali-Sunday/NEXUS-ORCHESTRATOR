<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Orchestrator - Autonomous Workspace</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
  :root { color-scheme: dark; }
  body { background: #020617; background-image: radial-gradient(at 8% 0%, rgba(6,182,212,.16), transparent 40%), radial-gradient(at 95% 10%, rgba(99,102,241,.18), transparent 42%); background-attachment: fixed; }
  .glass { background: rgba(17,24,39,.72); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.1); }
  .glass-panel { background: rgba(31,41,55,.5); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.06); }
  .btn { font-size: .75rem; background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: .4rem .75rem; border-radius: .6rem; transition: .15s; white-space: nowrap; cursor: pointer; }
  .btn:hover { background: #334155; }
  .btn.on { background: rgba(6,182,212,.22); border-color: #06b6d4; color: #a5f3fc; }
  .chip { font-size: .72rem; background: rgba(15,23,42,.8); border: 1px solid #334155; color: #cbd5e1; padding: .3rem .6rem; border-radius: 999px; cursor: pointer; }
  .field { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: .6rem; padding: .55rem .7rem; color: #e2e8f0; font-size: .85rem; margin-top: .25rem; }
  .md { color: #e2e8f0; font-size: .92rem; line-height: 1.7; word-wrap: break-word; }
  .md h1 { font-size: 1.6rem; font-weight: 800; color: #67e8f9; margin: 0 0 .8rem; }
  .md h2 { font-size: 1.25rem; font-weight: 700; color: #c7d2fe; margin: 1.4rem 0 .5rem; border-bottom: 1px solid rgba(148,163,184,.2); }
  .toast { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: .6rem .9rem; border-radius: .7rem; font-size: .8rem; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
</style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans">

<header class="glass border-b border-slate-800 sticky top-0 z-40 px-4 sm:px-6 py-3 flex justify-between items-center gap-3">
  <div class="flex items-center space-x-3 min-w-0">
    <div id="health-dot" class="w-3 h-3 bg-cyan-500 rounded-full animate-pulse shrink-0"></div>
    <h1 class="text-lg sm:text-xl font-bold tracking-wider bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent truncate">NEXUS ORCHESTRATOR</h1>
  </div>
  <div class="flex items-center space-x-2 sm:space-x-3">
    <span id="user-badge" class="hidden sm:inline text-xs px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-slate-300">Modo Invitado</span>
    <button onclick="openHistory()" class="btn">🕘 Historial</button>
    <button onclick="toggleModal('profile-modal')" class="text-xs bg-cyan-600/30 text-cyan-300 border border-cyan-500/30 px-3 py-1.5 rounded-lg">Perfil</button>
  </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
  <section class="lg:col-span-4 flex flex-col space-y-5">
    <div class="glass-panel p-5 rounded-2xl shadow-xl">
      <h2 class="text-sm font-semibold text-slate-400 uppercase mb-3">Entorno Profesional</h2>
      <select id="profession-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-200">
        <option value="general">Nexus General (Core OS)</option>
        <option value="mining">AuraX Global (Minería &amp; ESG)</option>
        <option value="teaching">Lingua Orchestrator (Pedagogía)</option>
        <option value="lawyer">Jurídica Nexus (Derecho)</option>
        <option value="doctor">Clinic Nexus (Salud)</option>
        <option value="music">Sonic Orchestrator (Música)</option>
        <option value="admin">Nexus Command (Sistemas)</option>
      </select>
      <p id="env-desc" class="text-xs text-slate-400 mt-2"></p>
      <div id="quick-prompts" class="flex flex-wrap gap-2 mt-3"></div>
    </div>

    <div class="glass-panel p-5 rounded-2xl shadow-xl flex flex-col">
      <h2 class="text-sm font-semibold text-slate-400 uppercase mb-3">Centro de Comando</h2>
      <textarea id="prompt-input" rows="6" placeholder="Escribe tu instrucción aquí…" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 text-sm resize-none"></textarea>
      <div class="mt-4 flex gap-2">
        <button onclick="sendPrompt()" id="send-btn" class="flex-1 bg-gradient-to-r from-cyan-600 to-indigo-600 text-white font-medium py-3 rounded-xl shadow-lg transition">⚡ Ejecutar Orquestación</button>
      </div>
    </div>
  </section>

  <section class="lg:col-span-8 flex flex-col">
    <div class="glass-panel p-5 rounded-2xl shadow-xl flex-1 flex flex-col min-h-[600px]">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold text-slate-400 uppercase">Canvas Compilador</h2>
      </div>
      <div id="canvas-output" class="md w-full h-full min-h-[420px] bg-slate-900/80 border border-slate-800 rounded-xl p-4 overflow-y-auto whitespace-pre-wrap font-mono text-sm"></div>
    </div>
  </section>
</main>

<div id="toasts" class="fixed bottom-4 right-4 z-[60] space-y-2"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const $ = id => document.getElementById(id);
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
async function sendPrompt() {
  const prompt = $('prompt-input').value.trim();
  const profession = $('profession-select').value;
  if (!prompt) return toast('Ingresa una instrucción.');
  $('canvas-output').textContent = 'Orquestando...';
  try {
    const res = await fetch('/api/orchestrate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'nexus' },
      body: JSON.stringify({ prompt, profession })
    });
    const data = await res.json();
    $('canvas-output').innerHTML = marked.parse(data.result || '');
  } catch (err) {
    toast('Error en la orquestación.');
  }
}
</script>
</body>
</html>
