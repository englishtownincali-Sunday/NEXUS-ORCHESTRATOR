<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ORCHESTRATOR - Autonomous Control Layer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #060913;
      --panel-bg: rgba(13, 18, 32, 0.75);
      --card-bg: #0b101d;
      --border-color: rgba(30, 41, 69, 0.8);
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --text-main: #f3f4f6;
      --text-muted: #6b7280;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ESTILO DE SCROLLBAR NEÓN PERSONALIZADA */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #04060d;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--accent-purple), var(--accent-cyan));
      border-radius: 9999px;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.8);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--accent-cyan), var(--accent-pink));
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(6, 182, 212, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 1.25rem 2rem;
      display: flex;
      flex-direction: column;
    }

    /* HEADER SUPERIOR */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
      font-size: 1.2rem;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
    }

    .brand-title h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #fff;
    }

    .brand-title p {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .status-badge {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--success);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .status-dot-green {
      width: 7px;
      height: 7px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    /* SELECTOR DE IDIOMA */
    .lang-select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      outline: none;
    }
    .lang-select option {
      background: #0d1220;
      color: #fff;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .btn-neon-small {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
    }

    .btn-neon-small:hover {
      background: rgba(59, 130, 246, 0.25);
      color: #fff;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
    }

    .btn-neon-primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #fff;
      border: none;
      padding: 0.4rem 0.95rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
      transition: all 0.2s;
    }

    .btn-neon-primary:hover {
      opacity: 0.9;
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.6);
    }

    /* METRICAS KPI */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .kpi-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.15rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      backdrop-filter: blur(10px);
    }

    .kpi-icon {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .kpi-icon.blue { background: rgba(59, 130, 246, 0.15); color: var(--accent-cyan); border: 1px solid rgba(59, 130, 246, 0.3); }
    .kpi-icon.purple { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); border: 1px solid rgba(139, 92, 246, 0.3); }
    .kpi-icon.green { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .kpi-icon.pink { background: rgba(236, 72, 153, 0.15); color: var(--accent-pink); border: 1px solid rgba(236, 72, 153, 0.3); }

    .kpi-info label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .kpi-info .val {
      font-size: 1.35rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #fff;
    }

    /* GRID PRINCIPAL */
    .main-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .panel-box {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
    }

    .panel-badge-count {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--accent-blue);
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    input[type="text"], input[type="email"], input[type="password"], select, textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.85rem;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-cyan);
    }

    .btn-gradient-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: #fff;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
      margin-top: 0.5rem;
      transition: opacity 0.2s;
    }

    .btn-gradient-submit:hover {
      opacity: 0.9;
    }

    /* WORKFLOW CARDS */
    .workflows-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .workflow-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.1rem;
    }

    .workflow-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.4rem;
    }

    .workflow-card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }

    .badge-priority {
      font-size: 0.65rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-priority.high { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-priority.medium { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    .workflow-card-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    .workflow-card-prompt {
      background: rgba(6, 9, 19, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.78rem;
      color: #d1d5db;
      font-style: italic;
      margin-bottom: 0.85rem;
    }

    .workflow-card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-tag {
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--success);
    }

    .workflow-btns {
      display: flex;
      gap: 0.5rem;
    }

    .btn-action-small {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .btn-action-small.danger {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    /* CONSOLA Y TERMINAL */
    .orchestration-section {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .terminal-box {
      background: #03060d;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 220px;
    }

    .terminal-topbar {
      background: #080d1a;
      padding: 0.5rem 0.85rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .terminal-dots {
      display: flex;
      gap: 0.4rem;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.red { background: #ef4444; }
    .dot.yellow { background: #f59e0b; }
    .dot.green { background: #10b981; }

    .terminal-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .terminal-content {
      padding: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--accent-cyan);
      flex: 1;
      white-space: pre-wrap;
